[package]
name = "eschaton"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = "0.18.1"
bevy_console = "0.17.1"
bevy_rand = "0.14"
bevy_prng = { version = "0.14", features = ["chacha20", "wyrand"] }
clap = "4.6.1"
rand_core = "0.10"
rand = "0.10.1"

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3
